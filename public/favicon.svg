<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#FFD60A" />
      <stop offset="65%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#FF5400" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="28" fill="#06070a" />
  <!-- Solar Glow Ring -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#goldRing)" stroke-width="3" filter="url(#goldGlow)" />
  
  <!-- Rosy Crown -->
  <path d="M34 32 L40 40 L50 26 L60 40 L66 32 L64 45 L36 45 Z" fill="url(#goldRing)" filter="url(#goldGlow)" />

  <!-- Monogram PK -->
  <path d="M32 52 L32 75 M32 52 L44 52 C49 52 52 55 52 61 C52 67 49 70 44 70 L32 70 M44 68 L56 75" 
        stroke="url(#goldRing)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#goldGlow)" />
  
  <!-- Subtle Amber Star -->
  <circle cx="68" cy="55" r="3" fill="#FFF3B0" filter="url(#goldGlow)" />
</svg>
